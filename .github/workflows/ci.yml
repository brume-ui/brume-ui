name: CI

on:
  push:
    branches: [main, phase-1, phase-2]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate Linux screenshot baselines and commit them back to the branch
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write is only used by explicit snapshot mode to push the new baselines
      contents: write
    env:
      # Opt in via workflow_dispatch, or put [update-snapshots] in a trusted push's head commit.
      # PR commit messages never enable updates. Inspect bot PNG changes, then require normal CI.
      UPDATE_SNAPSHOTS: ${{ (github.event_name == 'workflow_dispatch' && inputs['update-snapshots'] == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[update-snapshots]')) }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Build before typecheck/test: packages resolve each other's types through dist/.
      # Uses the committed font subsets; scripts/split-fonts.py (fonttools) is never run in CI.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter ./apps/playground exec playwright install --with-deps chromium

      - name: E2E
        if: ${{ env.UPDATE_SNAPSHOTS != 'true' }}
        run: pnpm test:e2e

      - name: E2E (update Linux snapshots)
        if: ${{ env.UPDATE_SNAPSHOTS == 'true' }}
        run: pnpm --filter ./apps/playground exec playwright test --update-snapshots

      - name: Commit Linux snapshots
        if: ${{ env.UPDATE_SNAPSHOTS == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/playground/e2e/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
          else
            # Deliberately omit the opt-in marker so later pushes use normal assertion mode.
            git commit -m 'test(playground): update Linux screenshot baselines'
            git push
          fi

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
          retention-days: 14
