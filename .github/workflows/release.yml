name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # id-token lets npm exchange the GitHub OIDC token for a short-lived publish credential (trusted publishing)
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check package versions match the tag
        run: node scripts/check-versions.mjs "$GITHUB_REF_NAME"

      - run: pnpm build

      # Trusted publishing needs npm >= 11.5.1; node 24 may bundle an older npm.
      - name: Upgrade npm
        run: npm install -g npm@^11.17.0 && npm --version

      # pnpm pack rewrites workspace:* deps to real versions; npm publish then uploads the tarball
      # with OIDC auth + provenance. No NPM_TOKEN / NODE_AUTH_TOKEN is used.
      # The trusted publisher must allow "npm publish" (not only "stage publish") on npmjs.com.
      # npm refuses to publish a prerelease without an explicit dist-tag, so 1.0.0-alpha.3 goes to "alpha".
      - name: Publish to npmjs.com
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag=latest
          fi
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in packages/*/; do
            pnpm --dir "$dir" pack --pack-destination "$RUNNER_TEMP/tarballs"
          done
          # Skip versions already on the registry so a re-run after a partial failure finishes the rest.
          for tgz in "$RUNNER_TEMP"/tarballs/*.tgz; do
            spec=$(tar -xOf "$tgz" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0));p.name+"@"+p.version')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "skip $spec (already published)"
              continue
            fi
            npm publish "$tgz" --access public --provenance --tag "$dist_tag"
          done
