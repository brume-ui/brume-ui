name: CI

on:
  push:
    branches: [main, phase-1]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate Linux screenshot baselines and commit them back to the branch
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write is only used by the update-snapshots dispatch to push the new baselines
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Uses the committed font subsets; scripts/split-fonts.py (fonttools) is never run in CI.
      - run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter ./apps/playground exec playwright install --with-deps chromium

      - name: E2E
        if: ${{ !inputs.update-snapshots }}
        run: pnpm test:e2e

      - name: E2E (update Linux snapshots)
        if: ${{ inputs.update-snapshots }}
        run: pnpm --filter ./apps/playground exec playwright test --update-snapshots

      - name: Commit Linux snapshots
        if: ${{ inputs.update-snapshots }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/playground/e2e/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
          else
            git commit -m 'test(playground): update Linux screenshot baselines'
            git push
          fi

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
          retention-days: 14
